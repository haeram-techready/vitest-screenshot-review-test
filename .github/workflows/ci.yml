name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # the screenshot review comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Compares against the *-chromium-linux.png references. update-screenshots.yml writes them.
      - id: bootstrap
        run: bash .github/scripts/screenshot-bootstrap.sh
      - id: tests
        run: >-
          pnpm exec vitest run
          --reporter=default --reporter=github-actions
          --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-report.json"

      # The steps below report the screenshot result on the pull request. Bootstrap mode compared
      # nothing, so it skips them. Each `if` needs `!cancelled()`: without a status check GitHub
      # adds `success()`, which skips the step after the tests fail.
      - id: screenshots
        if: >-
          !cancelled() && steps.bootstrap.outputs.bootstrap == 'false'
          && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        run: |
          if [ -f "$RUNNER_TEMP/vitest-report.json" ]; then
            count=$(node .github/scripts/screenshot-report.mjs stage "$RUNNER_TEMP/vitest-report.json" "$RUNNER_TEMP/screenshot-diffs")
            echo "count=$count" >>"$GITHUB_OUTPUT"
          fi
      - id: upload
        if: "!cancelled() && steps.screenshots.outputs.count > 0"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-diffs
          path: ${{ runner.temp }}/screenshot-diffs
          if-no-files-found: ignore
      - if: "!cancelled() && steps.screenshots.outputs.count != ''"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node .github/scripts/screenshot-report.mjs comment "$RUNNER_TEMP/vitest-report.json" >"$RUNNER_TEMP/screenshot-comment.md"
          cat "$RUNNER_TEMP/screenshot-comment.md" >>"$GITHUB_STEP_SUMMARY"
      # One comment per pull request, found by its marker. A fork's token cannot comment, so a
      # fork pull request gets the job summary only.
      - if: >-
          !cancelled() && steps.screenshots.outputs.count != ''
          && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COUNT: ${{ steps.screenshots.outputs.count }}
        run: |
          pr=$PR_NUMBER
          if [ -z "$pr" ]; then
            # A manual workflow_dispatch run: the open pull request from this branch.
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open \
              --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')
          fi
          if [ -z "$pr" ]; then
            echo "No open pull request from $GITHUB_REF_NAME."
            exit 0
          fi
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- vitest-screenshots -->"))) | .id' | sed -n 1p)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/screenshot-comment.md" >/dev/null
          elif [ "$COUNT" -gt 0 ]; then
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/screenshot-comment.md"
          fi
