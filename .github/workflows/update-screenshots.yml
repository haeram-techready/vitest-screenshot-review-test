# Commits new *-chromium-linux.png screenshot references to a pull request branch.
#
# Two ways to start it:
# - Submit a pull request review whose body starts with `/update-screenshots` (Files changed >
#   Review changes > Comment). Only an OWNER, MEMBER or COLLABORATOR review counts.
# - Run it by hand on the branch: `gh workflow run update-screenshots.yml --ref <branch>`. GitHub
#   lists a workflow_dispatch workflow only when this file is on the default branch.
#
# A review run uses this file from the pull request's merge commit, not from the default branch.
# For a fork pull request GitHub gives that run a read-only token, and `prepare` refuses it.
#
# The job that runs the branch's code (`update`) gets a read-only token. The jobs that write
# (`commit`, `report`) run none of it: `commit` takes only PNG files from the `update` artifact.
#
# `commit` pushes with a token of the GitHub App in vars.SCREENSHOT_APP_CLIENT_ID (contents: write,
# this repository only). GitHub holds the pull_request run that a GITHUB_TOKEN push creates until
# a person approves it. A push with an App token starts CI as normal.
#
# Both triggers run this file from the pull request, so a pull request that edits it can read the
# App key in the `commit` job.
name: Update screenshots

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions: {}

env:
  PATHSPEC: ":(glob)**/__screenshots__/**/*-chromium-linux.png"

jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_dispatch'
        && startsWith(github.ref, 'refs/heads/')
        && github.ref_name != github.event.repository.default_branch)
      || (github.event_name == 'pull_request_review'
        && startsWith(github.event.review.body, '/update-screenshots')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      branch: ${{ steps.target.outputs.branch }}
      sha: ${{ steps.target.outputs.sha }}
      refusal: ${{ steps.target.outputs.refusal }}
    steps:
      - id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "branch=$GITHUB_REF_NAME" >>"$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          refuse() {
            echo "refusal=$1" >>"$GITHUB_OUTPUT"
            echo "::error::$1"
            exit 1
          }
          # Read the pull request again: the review event's copy is from when the review was submitted.
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '[.state, (.head.repo.full_name // ""), .head.ref, .head.sha] | @tsv')
          IFS=$'\t' read -r state head_repo branch sha <<<"$pr"
          [ "$head_repo" = "$GITHUB_REPOSITORY" ] || refuse "This pull request comes from a fork. The workflow does not run fork code."
          [ "$state" = open ] || refuse "This pull request is not open."
          [ "$branch" != "$DEFAULT_BRANCH" ] || refuse "This workflow does not commit to the default branch."
          # Every later job uses this commit. The push fails if the branch moves past it.
          echo "branch=$branch" >>"$GITHUB_OUTPUT"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

  update:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      count: ${{ steps.changes.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec vitest run --update
      # --update rewrites only a missing or mismatched reference, so changed files are the result.
      - id: changes
        run: |
          count=0
          while IFS= read -r -d '' file; do
            mkdir -p "$RUNNER_TEMP/screenshots/$(dirname "$file")"
            cp "$file" "$RUNNER_TEMP/screenshots/$file"
            echo "$file"
            count=$((count + 1))
          done < <(git ls-files -z --modified --others --exclude-standard -- "$PATHSPEC")
          echo "count=$count" >>"$GITHUB_OUTPUT"
      - if: steps.changes.outputs.count > 0
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: [prepare, update]
    if: needs.update.outputs.count > 0
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    env:
      BRANCH: ${{ needs.prepare.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SCREENSHOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCREENSHOT_APP_PRIVATE_KEY }}
          permission-contents: write
      # The artifact came from a job that ran branch code. Take only regular PNG files at
      # reference paths.
      - id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          cd "$RUNNER_TEMP/screenshots"
          files=()
          while IFS= read -r -d '' entry; do
            file=${entry#./}
            if [ -L "$entry" ] || [ ! -f "$entry" ] || [[ "/$file/" == */../* ]] \
              || [[ ! "$file" =~ ^([^/]+/)*__screenshots__/([^/]+/)*[^/]+-chromium-linux\.png$ ]] \
              || [ "$(head -c 8 "$entry" | od -An -tx1 | tr -d ' \n')" != 89504e470d0a1a0a ]; then
              echo "::error::Not a screenshot reference: $file"
              exit 1
            fi
            mkdir -p "$GITHUB_WORKSPACE/$(dirname "$file")"
            cp "$entry" "$GITHUB_WORKSPACE/$file"
            files+=("$file")
          done < <(find . -mindepth 1 ! -type d -print0)
          cd "$GITHUB_WORKSPACE"
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "No reference changed."
            exit 0
          fi
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "users/$bot" --jq .id)
          git -c user.name="$bot" -c user.email="$bot_id+$bot@users.noreply.github.com" \
            commit -m "Update Linux screenshot references" -m "Requested by @$GITHUB_ACTOR ($GITHUB_EVENT_NAME)."
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      # Not a force push: it fails if someone pushed to the branch after `prepare` read it.
      - if: steps.commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.$GITHUB_SERVER_URL/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$BRANCH"

  report:
    needs: [prepare, update, commit]
    if: always() && needs.prepare.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write # the result comment
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PREPARE: ${{ needs.prepare.result }}
          REFUSAL: ${{ needs.prepare.outputs.refusal }}
          UPDATE: ${{ needs.update.result }}
          COUNT: ${{ needs.update.outputs.count }}
          COMMIT: ${{ needs.commit.result }}
          COMMIT_SHA: ${{ needs.commit.outputs.sha }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$PREPARE" != success ]; then
            message="Screenshot update refused. ${REFUSAL:-The pull request could not be read.} [Run]($run_url)"
          elif [ "$UPDATE" != success ]; then
            message="Screenshot update failed while running the tests. [Run]($run_url)"
          elif [ "${COUNT:-0}" -eq 0 ]; then
            message="No screenshot changed, so there is nothing to commit. [Run]($run_url)"
          elif [ "$COMMIT" != success ]; then
            message="Screenshot update failed to commit or push. If the branch moved, start the update again. [Run]($run_url)"
          elif [ -z "$COMMIT_SHA" ]; then
            message="The new screenshots match the files on \`$BRANCH\`, so there is nothing to commit. [Run]($run_url)"
          else
            message="Committed $COUNT screenshot reference(s) to \`$BRANCH\` in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$COMMIT_SHA. CI runs again on that commit. [Run]($run_url)"
          fi
          echo "$message" >>"$GITHUB_STEP_SUMMARY"
          pr=$PR_NUMBER
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # A manual run: the open pull request from this branch.
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open \
              --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')
          elif [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            # A fork's token cannot comment.
            pr=
          fi
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "$message"
          fi
